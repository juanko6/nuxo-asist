# Stack de producción: todo en un servidor con `docker compose up -d`.
# Requiere un .env en la raíz (copia .env.example y ajusta los valores).

# Nombre de proyecto propio para no colisionar con el stack de desarrollo
name: asist_employed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
    ports:
      # Solo localhost: permite ejecutar scripts desde el host (seed) sin exponer
      # Postgres a la red. En la VM de producción queda accesible únicamente desde
      # la propia máquina, nunca desde internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - asist_db_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      # Solo localhost: acceso directo a la API desde el host (debug/Swagger) sin
      # exponerla a la red. El frontend la proxyea por el mismo origen vía nginx,
      # así que en producción no necesita estar publicada hacia fuera.
      - "127.0.0.1:${API_PORT:-8000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?definir en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_CLOSE_ENABLED: ${AUTO_CLOSE_ENABLED:-true}
      AUTO_CLOSE_CRON: ${AUTO_CLOSE_CRON:-*/5 * * * *}
      AUTO_CLOSE_WARN_MINUTES: ${AUTO_CLOSE_WARN_MINUTES:-15}
      AUTO_CLOSE_GRACE_MINUTES: ${AUTO_CLOSE_GRACE_MINUTES:-30}
      MAX_SHIFT_HOURS: ${MAX_SHIFT_HOURS:-12}
      ABSENCE_CHECK_ENABLED: ${ABSENCE_CHECK_ENABLED:-true}
      ABSENCE_CHECK_CRON: ${ABSENCE_CHECK_CRON:-0 6 * * *}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-nuxoasist <no-reply@nuxoasist.app>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-nuxoasist@gmail.com}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
    depends_on:
      db:
        condition: service_healthy
    # Las migraciones se aplican automáticamente al arrancar (src/server.ts)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backups automáticos de Postgres con retención (Ley de control horario: 4 años).
  # Hace pg_dump según SCHEDULE y conserva diarios/semanales/mensuales; los
  # mensuales cubren 48 meses. Los dumps quedan en el volumen asist_backups.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-48}
    volumes:
      - asist_backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  asist_db_prod:
  asist_backups:
